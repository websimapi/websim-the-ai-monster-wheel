<html><head><base href="/" />
<title>The AI Monster Wheel</title>
<style>
/* Core styles */
:root {
  --primary-color: #2a0044;
  --accent-color: #ff00ff;
  --glow-color: #ff00ff80;
}

body {
  background: #000;
  color: #fff;
  font-family: 'Courier New', monospace;
  margin: 0;
  padding: 20px;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* Monster container styles */
.monster-container {
  position: relative;
  width: 100%;
  max-width: 800px;
  min-height: 400px;
  border: 2px solid var(--accent-color);
  border-radius: 15px;
  padding: 20px;
  margin: 20px 0;
  box-shadow: 0 0 20px var(--glow-color);
  opacity: 0;
  transform: translateY(20px);
  animation: fadeIn 1s ease-out forwards;
}

@keyframes fadeIn {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* Text input area */
#context-input {
  width: 100%;
  min-height: 150px;
  background: rgba(255,255,255,0.1);
  border: 1px solid var(--accent-color);
  border-radius: 8px;
  color: #fff;
  padding: 15px;
  margin: 20px 0;
  font-size: 16px;
  resize: vertical;
}

/* Feed button styles */
.feed-button {
  background: var(--primary-color);
  color: var(--accent-color);
  border: 2px solid var(--accent-color);
  padding: 15px 30px;
  font-size: 18px;
  border-radius: 25px;
  cursor: pointer;
  transition: all 0.3s ease;
  margin: 10px;
}

.feed-button:hover {
  background: var(--accent-color);
  color: var(--primary-color);
  box-shadow: 0 0 15px var(--glow-color);
}

/* Wheel styles */
.wheel-container {
  position: relative;
  width: 300px;
  height: 300px;
  margin: 40px auto;
  display: none;
}

.wheel {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  position: relative;
  transition: transform 3s cubic-bezier(0.17, 0.67, 0.12, 0.99);
}

/* Monster SVG container */
.monster-display {
  width: 100%;
  height: 400px;
  display: flex;
  justify-content: center;
  align-items: center;
  margin: 20px 0;
}

/* Loading animation */
.loading {
  display: none;
  width: 50px;
  height: 50px;
  border: 5px solid var(--primary-color);
  border-top: 5px solid var(--accent-color);
  border-radius: 50%;
  animation: spin 1s linear infinite;
}

@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

/* Status message styles */
.status-message {
  color: var(--accent-color);
  font-size: 18px;
  text-align: center;
  margin: 10px 0;
  min-height: 27px;
}

/* Phase indicator */
.phase-indicator {
  display: flex;
  justify-content: center;
  gap: 20px;
  margin: 20px 0;
}

.phase {
  padding: 8px 16px;
  border-radius: 15px;
  background: rgba(255,255,255,0.1);
  opacity: 0.5;
}

.phase.active {
  background: var(--accent-color);
  opacity: 1;
}
</style>
</head>
<body>
  <h1>The AI Monster Wheel</h1>
  
  <div class="monster-container">
    <div class="phase-indicator">
      <div class="phase" id="phase-html">HTML Phase</div>
      <div class="phase" id="phase-css">CSS Phase</div>
      <div class="phase" id="phase-js">JS Phase</div>
    </div>

    <textarea id="context-input" placeholder="Feed me your context... Let me understand what kind of monster I should become..."></textarea>
    
    <div class="button-container">
      <button class="feed-button" id="feed-button">Feed the Monster</button>
      <button class="feed-button" id="spin-button" disabled>Spin the Wheel</button>
    </div>

    <div class="status-message" id="status-message"></div>
    <div class="loading" id="loading"></div>
    
    <div class="monster-display" id="monster-display">
      <!-- Initial monster face SVG -->
      <svg width="200" height="200" viewBox="0 0 200 200">
        <circle cx="100" cy="100" r="90" fill="none" stroke="#ff00ff" stroke-width="4"/>
        <circle cx="70" cy="80" r="20" fill="#ff00ff" class="eye"/>
        <circle cx="130" cy="80" r="20" fill="#ff00ff" class="eye"/>
        <path d="M 60 120 Q 100 150 140 120" fill="none" stroke="#ff00ff" stroke-width="4"/>
      </svg>
    </div>

    <div class="wheel-container" id="wheel-container">
      <!-- Wheel will be dynamically created -->
    </div>
  </div>

<script>
// State management
let monsterContext = '';
let currentPhase = 'idle';
let monsterHtml = '';
let monsterCss = '';
let monsterJs = '';

// DOM Elements
const contextInput = document.getElementById('context-input');
const feedButton = document.getElementById('feed-button');
const spinButton = document.getElementById('spin-button');
const statusMessage = document.getElementById('status-message');
const loading = document.getElementById('loading');
const monsterDisplay = document.getElementById('monster-display');

// Phase indicators
const phaseHtml = document.getElementById('phase-html');
const phaseCss = document.getElementById('phase-css');
const phaseJs = document.getElementById('phase-js');

// Helper function to update status
function updateStatus(message, isLoading = false) {
  statusMessage.textContent = message;
  loading.style.display = isLoading ? 'block' : 'none';
}

// Helper function to update phase indicators
function updatePhase(phase) {
  [phaseHtml, phaseCss, phaseJs].forEach(el => el.classList.remove('active'));
  if (phase === 'html') phaseHtml.classList.add('active');
  if (phase === 'css') phaseCss.classList.add('active');
  if (phase === 'js') phaseJs.classList.add('active');
}

// AI Request function
async function makeAIRequest(phase, context) {
  try {
    const response = await fetch('/api/ai_completion', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Accept': 'application/json',
      },
      body: JSON.stringify({
        prompt: `Based on the following context, generate the ${phase.toUpperCase()} part of a monster visualization:
        
        <typescript-interface>
        interface Response {
          code: string;
          description: string;
        }
        </typescript-interface>
        
        <example>
        {
          "code": "${phase === 'html' ? '<div class="monster">...</div>' : 
                   phase === 'css' ? '.monster { ... }' : 
                   'function animateMonster() { ... }'}",
          "description": "A detailed description of the generated code and its purpose"
        }
        </example>`,
        data: context
      }),
    });
    
    const data = await response.json();
    return data;
  } catch (error) {
    console.error('Error making AI request:', error);
    throw new Error('Failed to generate monster part');
  }
}

// Feed button click handler
feedButton.addEventListener('click', async () => {
  monsterContext = contextInput.value.trim();
  
  if (!monsterContext) {
    updateStatus('Please provide some context first!');
    return;
  }

  // Start HTML Phase
  updateStatus('Generating HTML structure...', true);
  updatePhase('html');
  
  try {
    const htmlResponse = await makeAIRequest('html', monsterContext);
    monsterHtml = htmlResponse.code;
    updateStatus('HTML generated! Waiting for CSS phase...', false);
    
    // Wait 15 seconds before CSS phase
    setTimeout(async () => {
      updateStatus('Generating CSS styles...', true);
      updatePhase('css');
      
      const cssResponse = await makeAIRequest('css', monsterContext);
      monsterCss = cssResponse.code;
      updateStatus('CSS generated! Waiting for JS phase...', false);
      
      // Wait 15 seconds before JS phase
      setTimeout(async () => {
        updateStatus('Generating JavaScript animations...', true);
        updatePhase('js');
        
        const jsResponse = await makeAIRequest('js', monsterContext);
        monsterJs = jsResponse.code;
        
        updateStatus('Monster is ready! You can now spin the wheel!', false);
        spinButton.disabled = false;
      }, 15000);
    }, 15000);
  } catch (error) {
    updateStatus('Error generating monster: ' + error.message);
  }
});

// Spin button click handler
spinButton.addEventListener('click', () => {
  // Create a temporary stylesheet for the monster's CSS
  const styleSheet = document.createElement('style');
  styleSheet.textContent = monsterCss;
  document.head.appendChild(styleSheet);
  
  // Insert the monster's HTML
  monsterDisplay.innerHTML = monsterHtml;
  
  // Create and execute the monster's JavaScript
  const script = document.createElement('script');
  script.textContent = monsterJs;
  document.body.appendChild(script);
});

// Initial animation for the monster face
document.querySelectorAll('.eye').forEach(eye => {
  eye.style.animation = 'blink 2s infinite';
});

// Add this CSS for the blinking animation
const blinkStyle = document.createElement('style');
blinkStyle.textContent = `
  @keyframes blink {
    0%, 90%, 100% { transform: scaleY(1); }
    95% { transform: scaleY(0.1); }
  }
`;
document.head.appendChild(blinkStyle);
</script>

</body></html>
