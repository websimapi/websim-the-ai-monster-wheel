<html><head><base href="/" />
<title>The AI Monster Wheel</title>
<style>
/* Core styles */
:root {
  --primary-color: #2a0044;
  --accent-color: #ff00ff;
  --glow-color: #ff00ff80;
}

body {
  background: #000;
  color: #fff;
  font-family: 'Courier New', monospace;
  margin: 0;
  padding: 20px;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* Monster container styles */
.monster-container {
  position: relative;
  width: 100%;
  max-width: 800px;
  min-height: 400px;
  border: 2px solid var(--accent-color);
  border-radius: 15px;
  padding: 20px;
  margin: 20px 0;
  box-shadow: 0 0 20px var(--glow-color);
  opacity: 0;
  transform: translateY(20px);
  animation: fadeIn 1s ease-out forwards;
}

@keyframes fadeIn {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* Text input area */
#context-input {
  width: 100%;
  min-height: 150px;
  background: rgba(255,255,255,0.1);
  border: 1px solid var(--accent-color);
  border-radius: 8px;
  color: #fff;
  padding: 15px;
  margin: 20px 0;
  font-size: 16px;
  resize: vertical;
}

/* Feed button styles */
.feed-button {
  background: var(--primary-color);
  color: var(--accent-color);
  border: 2px solid var(--accent-color);
  padding: 15px 30px;
  font-size: 18px;
  border-radius: 25px;
  cursor: pointer;
  transition: all 0.3s ease;
  margin: 10px;
}

.feed-button:hover {
  background: var(--accent-color);
  color: var(--primary-color);
  box-shadow: 0 0 15px var(--glow-color);
}

/* Wheel styles */
.wheel-container {
  position: relative;
  width: 300px;
  height: 300px;
  margin: 40px auto;
  display: none;
}

.wheel {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  position: relative;
  transition: transform 3s cubic-bezier(0.17, 0.67, 0.12, 0.99);
}

/* Monster SVG container */
.monster-display {
  width: 100%;
  height: 400px;
  display: flex;
  justify-content: center;
  align-items: center;
  margin: 20px 0;
}

/* Loading animation */
.loading {
  display: none;
  width: 50px;
  height: 50px;
  border: 5px solid var(--primary-color);
  border-top: 5px solid var(--accent-color);
  border-radius: 50%;
  animation: spin 1s linear infinite;
}

@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

/* Status message styles */
.status-message {
  color: var(--accent-color);
  font-size: 18px;
  text-align: center;
  margin: 10px 0;
  min-height: 27px;
}

/* Phase indicator */
.phase-indicator {
  display: flex;
  justify-content: center;
  gap: 20px;
  margin: 20px 0;
}

.phase {
  padding: 8px 16px;
  border-radius: 15px;
  background: rgba(255,255,255,0.1);
  opacity: 0.5;
}

.phase.active {
  background: var(--accent-color);
  opacity: 1;
}

/* Adding new debug console styles */
.debug-console {
  width: 100%;
  max-width: 800px;
  min-height: 200px;
  background: rgba(0, 0, 0, 0.8);
  border: 1px solid var(--accent-color);
  border-radius: 8px;
  margin-top: 20px;
  padding: 15px;
  font-family: monospace;
  overflow-y: auto;
  max-height: 400px;
}

.debug-entry {
  margin: 5px 0;
  padding: 5px;
  border-left: 3px solid var(--accent-color);
}

.debug-error {
  color: #ff4444;
}

.debug-warning {
  color: #ffaa00;
}

.debug-info {
  color: #00aaff;
}

.debug-success {
  color: #44ff44;
}
</style>
</head>
<body>
  <h1>The AI Monster Wheel</h1>
  
  <div class="monster-container">
    <div class="phase-indicator">
      <div class="phase" id="phase-html">HTML Phase</div>
      <div class="phase" id="phase-css">CSS Phase</div>
      <div class="phase" id="phase-js">JS Phase</div>
    </div>

    <textarea id="context-input" placeholder="Feed me your context... Let me understand what kind of monster I should become..."></textarea>
    
    <div class="button-container">
      <button class="feed-button" id="feed-button">Feed the Monster</button>
      <button class="feed-button" id="spin-button" disabled>Spin the Wheel</button>
    </div>

    <div class="status-message" id="status-message"></div>
    <div class="loading" id="loading"></div>
    
    <div class="monster-display" id="monster-display">
      <!-- Initial monster face SVG -->
      <svg width="200" height="200" viewBox="0 0 200 200">
        <circle cx="100" cy="100" r="90" fill="none" stroke="#ff00ff" stroke-width="4"/>
        <circle cx="70" cy="80" r="20" fill="#ff00ff" class="eye"/>
        <circle cx="130" cy="80" r="20" fill="#ff00ff" class="eye"/>
        <path d="M 60 120 Q 100 150 140 120" fill="none" stroke="#ff00ff" stroke-width="4"/>
      </svg>
    </div>

    <div class="wheel-container" id="wheel-container">
      <!-- Wheel will be dynamically created -->
    </div>
  </div>

  <!-- Adding debug console -->
  <div class="debug-console" id="debug-console">
    <div class="debug-entry debug-info">Debug console initialized...</div>
  </div>

<script>
// State management
let monsterContext = '';
let currentPhase = 'idle';
let monsterHtml = '';
let monsterCss = '';
let monsterJs = '';
let debugHistory = [];

// DOM Elements
const contextInput = document.getElementById('context-input');
const feedButton = document.getElementById('feed-button');
const spinButton = document.getElementById('spin-button');
const statusMessage = document.getElementById('status-message');
const loading = document.getElementById('loading');
const monsterDisplay = document.getElementById('monster-display');
const debugConsole = document.getElementById('debug-console');

// Phase indicators
const phaseHtml = document.getElementById('phase-html');
const phaseCss = document.getElementById('phase-css');
const phaseJs = document.getElementById('phase-js');

// Debug logging function
function debugLog(message, type = 'info') {
  const timestamp = new Date().toISOString();
  const logEntry = {
    timestamp,
    message,
    type
  };
  
  debugHistory.push(logEntry);
  
  const debugEntry = document.createElement('div');
  debugEntry.className = `debug-entry debug-${type}`;
  debugEntry.textContent = `[${timestamp}] ${message}`;
  debugConsole.appendChild(debugEntry);
  debugConsole.scrollTop = debugConsole.scrollHeight;
  
  // Also log to console for browser dev tools
  console[type === 'error' ? 'error' : 'log'](`[${type.toUpperCase()}] ${message}`);
}

// Enhanced helper function to update status with debug logging
function updateStatus(message, isLoading = false) {
  statusMessage.textContent = message;
  loading.style.display = isLoading ? 'block' : 'none';
  debugLog(message, isLoading ? 'info' : 'success');
}

// Enhanced helper function to update phase indicators
function updatePhase(phase) {
  [phaseHtml, phaseCss, phaseJs].forEach(el => el.classList.remove('active'));
  if (phase === 'html') phaseHtml.classList.add('active');
  if (phase === 'css') phaseCss.classList.add('active');
  if (phase === 'js') phaseJs.classList.add('active');
  debugLog(`Phase changed to: ${phase}`, 'info');
}

// Enhanced AI Request function with better error handling and debugging
async function makeAIRequest(phase, context) {
  debugLog(`Starting ${phase.toUpperCase()} generation request...`, 'info');
  
  try {
    const response = await fetch('/api/ai_completion', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Accept': 'application/json',
      },
      body: JSON.stringify({
        prompt: `Based on the following context, generate the ${phase.toUpperCase()} part of a monster visualization:
        
        <typescript-interface>
        interface Response {
          code: string;
          description: string;
        }
        </typescript-interface>
        
        <example>
        {
          "code": "${phase === 'html' ? '<div class="monster">...</div>' : 
                   phase === 'css' ? '.monster { ... }' : 
                   'function animateMonster() { ... }'}",
          "description": "A detailed description of the generated code and its purpose"
        }
        </example>`,
        data: context
      }),
    });
    
    if (!response.ok) {
      throw new Error(`HTTP error! status: ${response.status}`);
    }
    
    const data = await response.json();
    debugLog(`Successfully generated ${phase.toUpperCase()} code`, 'success');
    return data;
  } catch (error) {
    debugLog(`Error in ${phase.toUpperCase()} generation: ${error.message}`, 'error');
    throw error;
  }
}

// Enhanced feed button click handler with better error handling
feedButton.addEventListener('click', async () => {
  monsterContext = contextInput.value.trim();
  
  if (!monsterContext) {
    debugLog('No context provided', 'warning');
    updateStatus('Please provide some context first!');
    return;
  }

  debugLog(`Starting monster generation with context length: ${monsterContext.length}`, 'info');
  
  try {
    // HTML Phase
    updateStatus('Generating HTML structure...', true);
    updatePhase('html');
    
    const htmlResponse = await makeAIRequest('html', monsterContext);
    monsterHtml = htmlResponse.code;
    updateStatus('HTML generated! Waiting for CSS phase...', false);
    
    // CSS Phase
    setTimeout(async () => {
      try {
        updateStatus('Generating CSS styles...', true);
        updatePhase('css');
        
        const cssResponse = await makeAIRequest('css', monsterContext);
        monsterCss = cssResponse.code;
        updateStatus('CSS generated! Waiting for JS phase...', false);
        
        // JS Phase
        setTimeout(async () => {
          try {
            updateStatus('Generating JavaScript animations...', true);
            updatePhase('js');
            
            const jsResponse = await makeAIRequest('js', monsterContext);
            monsterJs = jsResponse.code;
            
            updateStatus('Monster is ready! You can now spin the wheel!', false);
            spinButton.disabled = false;
          } catch (error) {
            debugLog(`JS Phase Error: ${error.message}`, 'error');
            updateStatus('Error in JS generation phase');
          }
        }, 15000);
      } catch (error) {
        debugLog(`CSS Phase Error: ${error.message}`, 'error');
        updateStatus('Error in CSS generation phase');
      }
    }, 15000);
  } catch (error) {
    debugLog(`HTML Phase Error: ${error.message}`, 'error');
    updateStatus('Error in HTML generation phase');
  }
});

// Enhanced spin button click handler with error catching
spinButton.addEventListener('click', () => {
  debugLog('Attempting to apply generated monster code...', 'info');
  
  try {
    // Create a temporary stylesheet for the monster's CSS
    const styleSheet = document.createElement('style');
    styleSheet.textContent = monsterCss;
    document.head.appendChild(styleSheet);
    debugLog('Applied monster CSS', 'success');
    
    // Insert the monster's HTML
    monsterDisplay.innerHTML = monsterHtml;
    debugLog('Applied monster HTML', 'success');
    
    // Create and execute the monster's JavaScript
    const script = document.createElement('script');
    script.textContent = monsterJs;
    document.body.appendChild(script);
    debugLog('Applied monster JavaScript', 'success');
  } catch (error) {
    debugLog(`Error applying monster code: ${error.message}`, 'error');
    updateStatus('Error applying monster code');
  }
});

// Initial animation setup
try {
  document.querySelectorAll('.eye').forEach(eye => {
    eye.style.animation = 'blink 2s infinite';
  });
  
  const blinkStyle = document.createElement('style');
  blinkStyle.textContent = `
    @keyframes blink {
      0%, 90%, 100% { transform: scaleY(1); }
      95% { transform: scaleY(0.1); }
    }
  `;
  document.head.appendChild(blinkStyle);
  debugLog('Initial monster animation setup complete', 'success');
} catch (error) {
  debugLog(`Error setting up initial animation: ${error.message}`, 'error');
}

debugLog('Monster Wheel initialization complete', 'success');
</script>

</body></html>
